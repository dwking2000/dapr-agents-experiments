# Multi-App Run Template with ConversationCollector for testing
version: 1
common:
  resourcesPath: ./components
  logLevel: info
  appLogDestination: console
  daprdLogDestination: console

apps:
- appID: HobbitApp
  appDirPath: ./services/hobbit/
  command: ["../../.venv/bin/python", "app.py"]

- appID: WizardApp
  appDirPath: ./services/wizard/
  command: ["../../.venv/bin/python", "app.py"]

- appID: ElfApp
  appDirPath: ./services/elf/
  command: ["../../.venv/bin/python", "app.py"]

- appID: WorkflowApp
  appDirPath: ./services/workflow-random/
  command: ["../../.venv/bin/python", "app.py"]
  appPort: 8004

- appID: ConversationCollector
  appDirPath: ./../../tools/conversation-collector/services/collector/
  command: ["../../../../.venv/bin/python", "app.py"]
  appPort: 8005

- appID: ClientApp
  appDirPath: ./services/client/
  command: ["../../.venv/bin/python", "http_client.py"]